<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f6b4a" />
    <meta name="description" content="نظام ملف الإنجاز" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="نظام التقارير" />
    <title>نظام ملف الإنجاز</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --text: #1f2937;
        --muted: #6b7280;
        --primary: #0f6b4a;
        --primary-soft: #e8f5ef;
        --gold: #d4af37;
        --border: #e5e7eb;
        --shadow: 0 24px 60px rgba(15, 107, 74, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #ffffff;
        font-family: "Tajawal", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--text);
      }

      body {
        display: flex;
        flex-direction: column;
      }

      .welcome-screen {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at top, rgba(15, 107, 74, 0.08), transparent 32%),
          linear-gradient(180deg, #ffffff 0%, #fbfdfc 100%);
      }

      .welcome-card {
        width: min(100%, 560px);
        max-height: calc(100dvh - 48px);
        overflow: auto;
        background: rgba(255, 255, 255, 0.96);
        border: 1px solid rgba(229, 231, 235, 0.9);
        border-radius: 28px;
        box-shadow: var(--shadow);
        padding: clamp(24px, 5vw, 40px) clamp(18px, 4vw, 28px) clamp(20px, 4vw, 28px);
        text-align: center;
        position: relative;
        animation: cardIn 700ms cubic-bezier(0.23, 1, 0.32, 1) both;
      }

      .welcome-card::before {
        content: "";
        position: absolute;
        inset-inline: 0;
        top: 0;
        height: 6px;
        background: linear-gradient(90deg, var(--primary), var(--gold));
      }

      .logo {
        width: clamp(76px, 18vw, 92px);
        height: clamp(76px, 18vw, 92px);
        margin: 0 auto 18px;
        border-radius: clamp(22px, 5vw, 28px);
        background: #fff;
        overflow: hidden;
        box-shadow: 0 14px 30px rgba(15, 107, 74, 0.22);
      }

      .logo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 5vw, 3.2rem);
        line-height: 1.15;
        font-weight: 800;
        color: #123526;
      }

      .subtitle {
        margin: 14px 0 0;
        font-size: clamp(1.05rem, 2.5vw, 1.35rem);
        font-weight: 700;
        color: var(--primary);
      }

      .notice {
        margin: 18px auto 0;
        max-width: 46ch;
        color: #374151;
        font-size: clamp(1.02rem, 2.4vw, 1.18rem);
        line-height: 2;
        font-weight: 700;
      }

      .date {
        direction: rtl;
        unicode-bidi: plaintext;
        font-weight: 800;
        color: #123526;
        white-space: nowrap;
        display: inline-block;
      }

      .redirect {
        margin-top: 22px;
        font-size: 1.05rem;
        font-weight: 700;
        color: #123526;
      }

      .progress {
        margin-top: 18px;
        height: 10px;
        background: var(--primary-soft);
        border-radius: 999px;
        overflow: hidden;
      }

      .progress span {
        display: block;
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, var(--primary), var(--gold));
        animation: fillBar 10s linear forwards;
      }

      .seconds {
        margin-top: 10px;
        color: var(--muted);
        font-size: 0.95rem;
      }

      .install-tip {
        position: fixed;
        inset-inline: 16px;
        bottom: 92px;
        z-index: 35;
        background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(248,252,250,0.98));
        border: 1px solid rgba(15, 107, 74, 0.12);
        border-radius: 24px;
        box-shadow: 0 22px 54px rgba(17, 24, 39, 0.16);
        padding: 18px;
        display: none;
        backdrop-filter: blur(14px);
      }

      .install-tip.show {
        display: block;
        animation: tipIn 260ms ease-out both;
      }

      .install-tip h2 {
        margin: 0 0 10px;
        font-size: 1.12rem;
        color: #123526;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .install-tip p {
        margin: 0;
        color: var(--muted);
        line-height: 1.8;
        font-size: 0.96rem;
      }

      .install-badge {
        display: inline-grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border-radius: 12px;
        background: var(--primary-soft);
        color: var(--primary);
        font-size: 1.1rem;
        flex: 0 0 auto;
      }

      .install-steps {
        margin: 12px 0 0;
        display: grid;
        gap: 10px;
      }

      .install-step {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        background: rgba(255,255,255,0.72);
        border: 1px solid rgba(229,231,235,0.9);
        border-radius: 16px;
        padding: 12px;
      }

      .install-step-icon {
        width: 34px;
        height: 34px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        background: #f3f7f5;
        color: var(--primary);
        font-size: 1.05rem;
        flex: 0 0 auto;
      }

      .install-step-text {
        color: #374151;
        line-height: 1.8;
        font-size: 0.96rem;
        font-weight: 600;
      }

      .install-actions {
        margin-top: 12px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      button {
        border: 0;
        border-radius: 14px;
        padding: 12px 18px;
        background: var(--primary);
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        transition: transform 160ms ease;
      }

      button:active {
        transform: scale(0.97);
      }

      button.secondary {
        background: var(--primary-soft);
        color: var(--primary);
      }

      .hidden {
        display: none !important;
      }

      @keyframes cardIn {
        from {
          opacity: 0;
          transform: translateY(18px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes fillBar {
        to {
          width: 100%;
        }
      }

      @keyframes tipIn {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 640px) {
        .welcome-screen {
          padding: 16px;
        }

        .welcome-card {
          border-radius: 24px;
        }

        .notice {
          line-height: 1.9;
        }
      }
    </style>
  </head>
  <body>
    <div class="welcome-screen" id="welcomeScreen">
      <section class="welcome-card" aria-live="polite">
        <div class="logo"><img src="200.png" alt="أيقونة نظام ملف الإنجاز" /></div>
        <h1>نظام ملف الإنجاز</h1>
        <p class="subtitle">الإصدار التجريبي المجاني</p>
        <p class="notice">
          التطبيق تحت التحديثات لمدة شهر كامل، وسيتم إطلاق التطبيق رسمياً في
          <span class="date">2026 / 10 / 01</span>
        </p>
        <p class="redirect">سيتم تحويلك إلى النظام خلال ثوانٍ</p>
        <div class="progress" aria-hidden="true"><span></span></div>
        <div class="seconds"><span id="countdown">10</span> ثوانٍ متبقية</div>
      </section>
    </div>

    <aside class="install-tip" id="installTip" role="dialog" aria-modal="false" aria-labelledby="installTitle">
      <h2 id="installTitle"><span class="install-badge">⬇</span> طريقة تثبيت التطبيق</h2>
      <p id="installText"></p>
      <div class="install-steps" id="installSteps"></div>
      <div class="install-actions">
        <button id="nativeInstallButton" type="button" class="hidden">تثبيت التطبيق</button>
        <button id="closeTipButton" type="button" class="secondary">إغلاق</button>
      </div>
    </aside>


    <script>
      const SYSTEM_URL = "https://teacherhub-e9sten9g.manus.space/female";
      const welcomeScreen = document.getElementById("welcomeScreen");
      const countdown = document.getElementById("countdown");
      const installTip = document.getElementById("installTip");
      const installText = document.getElementById("installText");
      const installSteps = document.getElementById("installSteps");
      const closeTipButton = document.getElementById("closeTipButton");
      const nativeInstallButton = document.getElementById("nativeInstallButton");

      let deferredPrompt = null;
      let redirectTimer = null;

      function isAppInstalled() {
        return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
      }

      function openSystemPage() {
        window.location.replace(SYSTEM_URL);
      }

      function hideInstallTipIfInstalled() {
        if (isAppInstalled()) {
          installTip.classList.remove("show");
          openSystemPage();
        }
      }

      function getPlatform() {
        const ua = navigator.userAgent || "";
        const isAndroid = /Android/i.test(ua);
        const isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        if (isAndroid) return "android";
        if (isIOS) return "ios";
        return "other";
      }

      function showInstallInstructions() {
        const platform = getPlatform();
        if (platform === "android") {
          installText.textContent = "لتثبيت التطبيق على جهاز أندرويد، اتبع الخطوات التالية:";
          installSteps.innerHTML = `
            <div class="install-step">
              <div class="install-step-icon">⋮</div>
              <div class="install-step-text">افتح الصفحة في متصفح Chrome ثم اضغط على قائمة النقاط الثلاث في الأعلى.</div>
            </div>
            <div class="install-step">
              <div class="install-step-icon">＋</div>
              <div class="install-step-text">اختر «إضافة إلى الشاشة الرئيسية» أو «تثبيت التطبيق».</div>
            </div>
            <div class="install-step">
              <div class="install-step-icon">✓</div>
              <div class="install-step-text">إذا ظهر زر «تثبيت التطبيق» هنا، يمكنك الضغط عليه مباشرة لإكمال التثبيت بسهولة.</div>
            </div>
          `;
          nativeInstallButton.classList.toggle("hidden", !deferredPrompt);
        } else if (platform === "ios") {
          installText.textContent = "لتثبيت التطبيق على iPhone أو iPad، اتبع الخطوات التالية:";
          installSteps.innerHTML = `
            <div class="install-step">
              <div class="install-step-icon">⎋</div>
              <div class="install-step-text">افتح الصفحة في متصفح Safari ثم اضغط زر المشاركة.</div>
            </div>
            <div class="install-step">
              <div class="install-step-icon">＋</div>
              <div class="install-step-text">اختر «إضافة إلى الشاشة الرئيسية» من القائمة.</div>
            </div>
            <div class="install-step">
              <div class="install-step-icon">✓</div>
              <div class="install-step-text">بعد التثبيت ستظهر الأيقونة على الشاشة الرئيسية ويمكنك فتح التطبيق منها مباشرة.</div>
            </div>
          `;
          nativeInstallButton.classList.add("hidden");
        } else {
          installText.textContent = "يمكنك تثبيت التطبيق من قائمة المتصفح إذا كان خيار التثبيت متاحاً على جهازك.";
          installSteps.innerHTML = "";
          nativeInstallButton.classList.add("hidden");
        }
        installTip.classList.add("show");
      }

      closeTipButton.addEventListener("click", () => {
        installTip.classList.remove("show");
        if (redirectTimer) clearTimeout(redirectTimer);
      });

      nativeInstallButton.addEventListener("click", async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        const choice = await deferredPrompt.userChoice;
        deferredPrompt = null;
        nativeInstallButton.classList.add("hidden");
        if (choice.outcome === "accepted") {
          installTip.classList.remove("show");
          openSystemPage();
        }
      });

      window.addEventListener("beforeinstallprompt", (event) => {
        event.preventDefault();
        deferredPrompt = event;
        if (getPlatform() === "android" && installTip.classList.contains("show")) {
          nativeInstallButton.classList.remove("hidden");
        }
      });

      window.addEventListener("appinstalled", () => {
        installTip.classList.remove("show");
        openSystemPage();
      });

      let remaining = 10;
      const timer = setInterval(() => {
        remaining -= 1;
        countdown.textContent = String(Math.max(remaining, 0));
        if (remaining <= 0) {
          clearInterval(timer);
          welcomeScreen.classList.add("hidden");
          if (isAppInstalled()) {
            openSystemPage();
            return;
          }
          showInstallInstructions();
        }
      }, 1000);

      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) {
          hideInstallTipIfInstalled();
        }
      });

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
